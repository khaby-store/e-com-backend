[package]
name = "ecom-secure-db"
version = "0.1.0"
edition = "2024"
description = "Axum backend backed by an encrypted, compressed, tamper-evident JSON store"
license = "MIT"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0"
axum = "0.8.9"
fd-lock = "4.0.4"
getrandom = "0.4"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = { version = "1.9.1", features = ["derive"] }
zstd = "0.14.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
